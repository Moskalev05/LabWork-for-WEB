{% extends 'myapp/base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="display-5 mb-4">
            <i class="bi bi-pencil text-primary"></i> Редактирование пользователя
        </h1>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-person-gear"></i> 
                    Редактирование: {{ edit_user.username }}
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Имя пользователя *</label>
                                <input type="text" class="form-control" name="username" 
                                       value="{{ edit_user.username }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" name="email" 
                                       value="{{ edit_user.email }}" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Имя *</label>
                                <input type="text" class="form-control" name="first_name" 
                                       value="{{ edit_user.first_name }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Фамилия *</label>
                                <input type="text" class="form-control" name="last_name" 
                                       value="{{ edit_user.last_name }}" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Телефон *</label>
                                <input type="text" class="form-control" name="phone" 
                                       value="{{ user_profile.phone }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Уровень доступа *</label>
                                <select name="access_level" class="form-select" 
                                        {% if edit_user == request.user %}disabled{% endif %}>
                                    <option value="viewer" {% if user_profile.access_level == 'viewer' %}selected{% endif %}>Обычный пользователь</option>
                                    <option value="admin" {% if user_profile.access_level == 'admin' %}selected{% endif %}>Администратор</option>
                                </select>
                                {% if edit_user == request.user %}
                                <div class="form-text text-warning">
                                    Вы не можете изменить свой собственный уровень доступа
                                </div>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Компания</label>
                                <input type="text" class="form-control" name="company" 
                                       value="{{ user_profile.company|default:'' }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Должность</label>
                                <input type="text" class="form-control" name="position" 
                                       value="{{ user_profile.position|default:'' }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'manage_users' %}" class="btn btn-secondary me-md-2">
                            <i class="bi bi-arrow-left"></i> Назад
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Сохранить изменения
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
